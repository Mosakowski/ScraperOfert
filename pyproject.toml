[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scraper_ofert_tv"
version = "0.1.0"
description = "Scraper ofert telewizorow z OLX"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "selectolax",
    "openpyxl",
    "PyYAML",
    "jinja2",
    "python-multipart",
    "schedule"
]

[project.optional-dependencies]
dev = [
    "pytest"
]
